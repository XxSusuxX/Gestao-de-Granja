kind = "web"
previewPath = "/gestao-granja/"
title = "Gestão da Granja"
description = "Sistema simples e fácil de usar no celular para pequenos criadores de galinhas, com cadastro rápido por botões, controle de estoque e acompanhamento de contas a pagar e receber."
version = "1.0.0"
id = "artifacts/gestao-granja"
router = "path"

[[services]]
name = "web"
paths = [ "/gestao-granja/" ]
localPort = 25395

[services.development]
run = "pnpm --filter @workspace/gestao-granja run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gestao-granja", "run", "build" ]
serve = "static"
publicDir = "artifacts/gestao-granja/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25395"
BASE_PATH = "/gestao-granja/"
