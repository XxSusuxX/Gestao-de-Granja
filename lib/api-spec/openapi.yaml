openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: inventory
    description: Farm inventory and stock movements
  - name: finance
    description: Payables and receivables
  - name: dashboard
    description: Farm overview
  - name: poultry
    description: Poultry lots and bird movements
  - name: feeding
    description: Feed recipes and flock consumption
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get farm overview
      responses:
        "200":
          description: Summary of inventory and pending finances
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /inventory/products:
    get:
      operationId: getProducts
      tags: [inventory]
      summary: List inventory products
      responses:
        "200":
          description: Product list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [inventory]
      summary: Add an inventory product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
  /inventory/products/{productId}:
    patch:
      operationId: updateProduct
      tags: [inventory]
      summary: Edit an inventory product
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Product not found
    delete:
      operationId: deleteProduct
      tags: [inventory]
      summary: Delete an inventory product
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "204":
          description: Product deleted
        "404":
          description: Product not found
        "409":
          description: Product cannot be deleted while it has stock history
  /inventory/movements:
    get:
      operationId: getMovements
      tags: [inventory]
      summary: List stock movements
      responses:
        "200":
          description: Stock movement list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Movement"
    post:
      operationId: createMovement
      tags: [inventory]
      summary: Add or remove stock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MovementInput"
      responses:
        "201":
          description: Stock movement recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Movement"
        "400":
          description: Invalid movement or insufficient stock
        "404":
          description: Product not found
  /inventory/movements/{movementId}:
    delete:
      operationId: deleteMovement
      tags: [inventory]
      summary: Delete a movement and reverse its stock change
      parameters:
        - in: path
          name: movementId
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "204":
          description: Movement deleted and stock restored
        "400":
          description: Reversing this movement would make stock negative
        "404":
          description: Movement not found
  /finance/entries:
    get:
      operationId: getFinanceEntries
      tags: [finance]
      summary: List payable and receivable entries
      responses:
        "200":
          description: Finance entry list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FinanceEntry"
    post:
      operationId: createFinanceEntry
      tags: [finance]
      summary: Add a payable or receivable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceEntryInput"
      responses:
        "201":
          description: Finance entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceEntry"
  /finance/entries/{entryId}:
    patch:
      operationId: updateFinanceEntry
      tags: [finance]
      summary: Edit or settle a payable or receivable
      parameters:
        - in: path
          name: entryId
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceEntryUpdate"
      responses:
        "200":
          description: Finance entry updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceEntry"
        "404":
          description: Finance entry not found
    delete:
      operationId: deleteFinanceEntry
      tags: [finance]
      summary: Delete a payable or receivable
      parameters:
        - in: path
          name: entryId
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "204":
          description: Finance entry deleted
        "404":
          description: Finance entry not found
  /poultry/summary:
    get:
      operationId: getPoultrySummary
      tags: [poultry]
      summary: Get poultry lot totals
      responses:
        "200":
          description: Current flock totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoultrySummary"
  /poultry/lots:
    get:
      operationId: getPoultryLots
      tags: [poultry]
      summary: List poultry lots
      responses:
        "200":
          description: Poultry lots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PoultryLot"
    post:
      operationId: createPoultryLot
      tags: [poultry]
      summary: Register an incoming poultry lot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PoultryLotInput"
      responses:
        "201":
          description: Poultry lot registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoultryLot"
  /poultry/lots/{lotId}:
    patch:
      operationId: updatePoultryLot
      tags: [poultry]
      summary: Edit poultry lot details
      parameters:
        - in: path
          name: lotId
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PoultryLotUpdate"
      responses:
        "200":
          description: Poultry lot updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoultryLot"
        "404":
          description: Poultry lot not found
  /poultry/lots/{lotId}/dispatches:
    post:
      operationId: createPoultryDispatch
      tags: [poultry]
      summary: Record birds leaving a lot
      parameters:
        - in: path
          name: lotId
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PoultryDispatchInput"
      responses:
        "201":
          description: Bird dispatch recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoultryMovement"
        "400":
          description: Invalid dispatch or too few birds in the lot
        "404":
          description: Poultry lot not found
  /poultry/movements:
    get:
      operationId: getPoultryMovements
      tags: [poultry]
      summary: List poultry arrivals and departures
      responses:
        "200":
          description: Poultry movement history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PoultryMovement"
  /poultry/movements/{movementId}:
    delete:
      operationId: deletePoultryMovement
      tags: [poultry]
      summary: Delete a poultry movement and reverse its bird count
      parameters:
        - in: path
          name: movementId
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "204":
          description: Poultry movement deleted
        "400":
          description: Reversing this movement would make the lot count invalid
        "404":
          description: Poultry movement not found
  /feeding/summary:
    get:
      operationId: getFeedingSummary
      tags: [feeding]
      summary: Get feeding totals
      responses:
        "200":
          description: Daily and monthly feed totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedingSummary"
  /feeding/recipes:
    get:
      operationId: getFeedRecipes
      tags: [feeding]
      summary: List feed recipes
      responses:
        "200":
          description: Feed recipes with ingredient costs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeedRecipe"
    post:
      operationId: createFeedRecipe
      tags: [feeding]
      summary: Create a feed recipe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedRecipeInput"
      responses:
        "201":
          description: Feed recipe created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedRecipe"
        "400":
          description: Invalid recipe or ingredient
  /feeding/recipes/{recipeId}:
    patch:
      operationId: updateFeedRecipe
      tags: [feeding]
      summary: Update a feed recipe
      parameters:
        - in: path
          name: recipeId
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedRecipeInput"
      responses:
        "200":
          description: Feed recipe updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedRecipe"
        "400":
          description: Invalid recipe or ingredient
        "404":
          description: Feed recipe not found
    delete:
      operationId: deleteFeedRecipe
      tags: [feeding]
      summary: Delete an unused feed recipe
      parameters:
        - in: path
          name: recipeId
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "204":
          description: Feed recipe deleted
        "404":
          description: Feed recipe not found
        "409":
          description: Recipe cannot be deleted after it has been used
  /feeding/logs:
    get:
      operationId: getFeedLogs
      tags: [feeding]
      summary: List feed consumption records
      responses:
        "200":
          description: Feeding history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeedLog"
    post:
      operationId: createFeedLog
      tags: [feeding]
      summary: Record feed consumed by a poultry lot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedLogInput"
      responses:
        "201":
          description: Feed consumption recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedLog"
        "400":
          description: Invalid feeding record or insufficient ingredient stock
        "404":
          description: Lot or recipe not found
  /feeding/logs/{logId}:
    delete:
      operationId: deleteFeedLog
      tags: [feeding]
      summary: Delete a feed log and restore its ingredients to stock
      parameters:
        - in: path
          name: logId
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "204":
          description: Feeding record deleted and ingredients restored
        "404":
          description: Feeding record not found
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    Product:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: string
          enum: [feed, medicine, supplies, equipment, other]
        unit:
          type: string
        quantity:
          type: number
        minimumQuantity:
          type: ["number", "null"]
        unitCost:
          type: ["number", "null"]
        createdAt:
          type: string
          format: date-time
      required: [id, name, category, unit, quantity, minimumQuantity, unitCost, createdAt]
    ProductInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        category:
          type: string
          enum: [feed, medicine, supplies, equipment, other]
        unit:
          type: string
          minLength: 1
        quantity:
          type: number
          minimum: 0
        minimumQuantity:
          type: ["number", "null"]
        unitCost:
          type: ["number", "null"]
      required: [name, category, unit, quantity]
    ProductUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        category:
          type: string
          enum: [feed, medicine, supplies, equipment, other]
        unit:
          type: string
          minLength: 1
        minimumQuantity:
          type: ["number", "null"]
        unitCost:
          type: ["number", "null"]
    Movement:
      type: object
      properties:
        id:
          type: integer
        productId:
          type: integer
        productName:
          type: string
        direction:
          type: string
          enum: [in, out]
        quantity:
          type: number
        note:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required: [id, productId, productName, direction, quantity, note, createdAt]
    MovementInput:
      type: object
      properties:
        productId:
          type: integer
          minimum: 1
        direction:
          type: string
          enum: [in, out]
        quantity:
          type: number
          exclusiveMinimum: 0
        note:
          type: string
      required: [productId, direction, quantity]
    FinanceEntry:
      type: object
      properties:
        id:
          type: integer
        kind:
          type: string
          enum: [payable, receivable]
        description:
          type: string
        amount:
          type: number
        dueDate:
          type: string
          format: date
        status:
          type: string
          enum: [pending, settled]
        category:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        settledAt:
          type: ["string", "null"]
          format: date-time
      required: [id, kind, description, amount, dueDate, status, category, createdAt, settledAt]
    FinanceEntryInput:
      type: object
      properties:
        kind:
          type: string
          enum: [payable, receivable]
        description:
          type: string
          minLength: 1
        amount:
          type: number
          exclusiveMinimum: 0
        dueDate:
          type: string
          format: date
        category:
          type: string
      required: [kind, description, amount, dueDate]
    FinanceEntryUpdate:
      type: object
      properties:
        description:
          type: string
          minLength: 1
        amount:
          type: number
          exclusiveMinimum: 0
        dueDate:
          type: string
          format: date
        category:
          type: string
        status:
          type: string
          enum: [pending, settled]
    Dashboard:
      type: object
      properties:
        productCount:
          type: integer
        lowStockCount:
          type: integer
        pendingPayables:
          type: number
        pendingReceivables:
          type: number
        recentFinanceEntries:
          type: array
          items:
            $ref: "#/components/schemas/FinanceEntry"
        lowStockProducts:
          type: array
          items:
            $ref: "#/components/schemas/Product"
      required:
        - productCount
        - lowStockCount
        - pendingPayables
        - pendingReceivables
        - recentFinanceEntries
        - lowStockProducts
    PoultryLot:
      type: object
      properties:
        id:
          type: integer
        label:
          type: string
        kind:
          type: string
          enum: [layers, broilers, chicks, other]
        receivedAt:
          type: string
          format: date
        source:
          type: ["string", "null"]
        breed:
          type: ["string", "null"]
        ageWeeks:
          type: ["integer", "null"]
        initialCount:
          type: integer
        currentCount:
          type: integer
        createdAt:
          type: string
          format: date-time
      required: [id, label, kind, receivedAt, source, breed, ageWeeks, initialCount, currentCount, createdAt]
    PoultryLotInput:
      type: object
      properties:
        label:
          type: string
          minLength: 1
        kind:
          type: string
          enum: [layers, broilers, chicks, other]
        receivedAt:
          type: string
          format: date
        source:
          type: string
        breed:
          type: string
        ageWeeks:
          type: integer
          minimum: 0
        initialCount:
          type: integer
          minimum: 1
      required: [label, kind, receivedAt, initialCount]
    PoultryLotUpdate:
      type: object
      properties:
        label:
          type: string
          minLength: 1
        source:
          type: ["string", "null"]
        breed:
          type: ["string", "null"]
        ageWeeks:
          type: ["integer", "null"]
    PoultryDispatchInput:
      type: object
      properties:
        quantity:
          type: integer
          minimum: 1
        movementDate:
          type: string
          format: date
        counterparty:
          type: string
        reason:
          type: string
          enum: [sale, transfer, mortality, other]
      required: [quantity, movementDate, reason]
    PoultryMovement:
      type: object
      properties:
        id:
          type: integer
        lotId:
          type: integer
        lotLabel:
          type: string
        direction:
          type: string
          enum: [in, out]
        quantity:
          type: integer
        movementDate:
          type: string
          format: date
        counterparty:
          type: ["string", "null"]
        reason:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required: [id, lotId, lotLabel, direction, quantity, movementDate, counterparty, reason, createdAt]
    PoultrySummary:
      type: object
      properties:
        activeLotCount:
          type: integer
        liveBirdCount:
          type: integer
      required: [activeLotCount, liveBirdCount]
    RecipeIngredientInput:
      type: object
      properties:
        productId:
          type: integer
          minimum: 1
        quantityKg:
          type: number
          exclusiveMinimum: 0
      required: [productId, quantityKg]
    RecipeIngredient:
      type: object
      properties:
        productId:
          type: integer
        productName:
          type: string
        quantityKg:
          type: number
        unitCost:
          type: ["number", "null"]
        lineCost:
          type: ["number", "null"]
        availableQuantity:
          type: number
      required: [productId, productName, quantityKg, unitCost, lineCost, availableQuantity]
    FeedRecipeInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        ingredients:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/RecipeIngredientInput"
      required: [name, ingredients]
    FeedRecipe:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        batchWeightKg:
          type: number
        costPerBatch:
          type: ["number", "null"]
        costPerKg:
          type: ["number", "null"]
        ingredients:
          type: array
          items:
            $ref: "#/components/schemas/RecipeIngredient"
        createdAt:
          type: string
          format: date-time
      required: [id, name, batchWeightKg, costPerBatch, costPerKg, ingredients, createdAt]
    FeedLogInput:
      type: object
      properties:
        lotId:
          type: integer
          minimum: 1
        recipeId:
          type: integer
          minimum: 1
        quantityKg:
          type: number
          exclusiveMinimum: 0
        feedingDate:
          type: string
          format: date
      required: [lotId, recipeId, quantityKg, feedingDate]
    FeedLog:
      type: object
      properties:
        id:
          type: integer
        lotId:
          type: integer
        lotLabel:
          type: string
        recipeId:
          type: integer
        recipeName:
          type: string
        quantityKg:
          type: number
        totalCost:
          type: ["number", "null"]
        feedingDate:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
      required: [id, lotId, lotLabel, recipeId, recipeName, quantityKg, totalCost, feedingDate, createdAt]
    FeedingSummary:
      type: object
      properties:
        todayQuantityKg:
          type: number
        todayCost:
          type: ["number", "null"]
        monthCost:
          type: ["number", "null"]
        logsToday:
          type: integer
      required: [todayQuantityKg, todayCost, monthCost, logsToday]

